[project]
name = "mlm-training"
version = "0.1.0"
description = "MLM Training for Encoder Models with PEFT/LoRA optimization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.4.0",
    "ipython>=9.6.0",
    "langchain-text-splitters>=1.0.0",
    "matplotlib>=3.10.7",
    "optuna>=4.6.0",
    "pre-commit>=4.3.0",
    "pymupdf>=1.26.5",
    "python-dotenv>=1.2.1",
    "python-pptx>=1.0.2",
    "transformers>=4.57.1",
    "peft>=0.13.0",
    "bitsandbytes>=0.45.0",
    "accelerate>=1.2.1",
    "sentencepiece>=0.2.0",
    "tensorboard>=2.18.0",
    "scipy>=1.15.1",
    "scikit-learn>=1.8.0",
    "pypdf>=6.7.0",
]

# PyTorch with CUDA support must be installed separately
# Run: uv pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

